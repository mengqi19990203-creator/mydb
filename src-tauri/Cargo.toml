[package]
name = "mydb"
version = "0.13.0"
description = "A lightweight, cross-platform database client"
authors = ["Mengqi"]
license = "Apache-2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mydb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", features = ["bigdecimal", "chrono", "json", "mysql", "postgres", "runtime-tokio", "sqlite", "uuid"] }
tokio = { version = "1.54.1", features = ["sync", "macros", "rt-multi-thread", "net", "io-util", "time"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }
async-trait = "0.1.92"
tauri-plugin-dialog = "2.8.4"
chrono = { version = "0.4.45", features = ["serde"] }
bigdecimal = "0.4.11"
keyring = { version = "4.2.0", features = ["v1"] }
russh = "0.65.1"
redis = { version = "0.32.7", features = ["tokio-comp", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
csv = "1.4.0"
futures-util = "0.3"
rust_xlsxwriter = "0.104.0"
percent-encoding = "2.3"
calamine = { version = "0.38.0", features = ["dates"] }
mongodb = "3.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
